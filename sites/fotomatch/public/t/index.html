<style>
*{box-sizing:border-box;margin:0}body{background:#111;color:#f4f1ee;font:16px/1.5 Inter,system-ui,-apple-system,sans-serif}
main{max-width:480px;margin:0 auto;padding:18px 16px 40px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.logo{font-weight:800;font-size:18px}.logo b{color:#fd267a}
.selo{font-size:12px;background:#22d48f22;color:#22d48f;padding:5px 10px;border-radius:99px;font-weight:700}

<script>
(async function(){
const EV="https://cdtfglylekiyxdmrgbne.supabase.co/functions/v1/match-evento";
const q=new URLSearchParams(location.search),c=(q.get('c')||'A1').toUpperCase(),DEMO=q.has('demo');
const ls={get:k=>{try{return localStorage.getItem(k)}catch{return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch{}}};
const S=ls.get('t30_s')||(()=>{const v=Array.from(crypto.getRandomValues(new Uint8Array(10)),x=>x.toString(16).padStart(2,'0')).join('');ls.set('t30_s',v);return v})();
const marca=(tela,ordem,extra)=>{if(DEMO)return;fetch(EV,{method:'POST',headers:{'Content-Type':'text/plain'},keepalive:true,body:JSON.stringify({sessao:S,pagina:'T30',tela,ordem,anuncio:'T-'+c,...(extra||{})})}).catch(()=>{})};
const D=await fetch('c.json?v=1').then(r=>r.json());const d=D[c]||D.A1;
document.getElementById('t').textContent=d.t;document.getElementById('img').src='../ad/t30/'+c+'.jpg';
document.getElementById('q').textContent=d.q;document.getElementById('nome').textContent=d.nome;document.getElementById('bt').textContent=d.btn;
document.getElementById('mec').innerHTML=d.mec.map(x=>'<li></li>').join('');[...document.querySelectorAll('#mec li')].forEach((li,i)=>li.textContent=d.mec[i]);
const op=document.getElementById('op');d.o.forEach((t,i)=>{const b=document.createElement('button');b.type='button';b.textContent=t;b.onclick=()=>{[...op.children].forEach(x=>x.classList.remove('on'));b.classList.add('on');marca('quiz:'+i,1)};op.appendChild(b)});
marca('inicio',0);
const u=new URL(d.dest,location.href);['utm_source','utm_medium','utm_campaign','utm_term','fbclid'].forEach(k=>q.get(k)&&u.searchParams.set(k,q.get(k)));u.searchParams.set('utm_content','T-'+c);
const btn=document.getElementById('btn');btn.href=u.toString();
btn.addEventListener('click',()=>{marca('ic',2);try{if(!DEMO&&window.fbq)fbq('trackCustom','T30_Botao',{value:9.9,currency:'BRL',content_name:'T-'+c})}catch{}});
})();
</script></body></html>
